services:
  - type: web
    name: clubconnect
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DB_PATH
        value: /var/data/clubconnect.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: System Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: clubconnect-data
      mountPath: /var/data
      sizeGB: 1
